---
- name: Generate local Terraform secret files
  hosts: local
  gather_facts: false
  tags:
    - terraform-secrets

  vars:
    terraform_directory: "{{ playbook_dir }}/../terraform"

  tasks:
    - name: Validate Terraform provider secrets
      ansible.builtin.assert:
        that:
          - vault_yc_service_account_key_b64 | default('') | trim | length > 0
          - yc_cloud_id | default('') | trim | length > 0
          - yc_folder_id | default('') | trim | length > 0
          - yc_zone | default('') | trim | length > 0
          - lookup('ansible.builtin.file', ssh_public_key_file, errors='ignore') | trim | length > 0
          - ssh_allowed_cidrs | default([]) | length > 0
        fail_msg: >-
          Configure the Yandex Cloud identifiers in vars.yml and the service
          account key in the encrypted vault.yml file.
      no_log: true

    - name: Validate Terraform backend secrets
      ansible.builtin.assert:
        that:
          - tf_state_bucket | default('') | trim | length > 0
          - vault_tf_state_access_key | default('') | trim | length > 0
          - vault_tf_state_secret_key | default('') | trim | length > 0
        fail_msg: >-
          Fill in the Object Storage backend values in the encrypted
          ansible/group_vars/all/vault.yml file.
      no_log: true

    - name: Validate application secrets
      ansible.builtin.assert:
        that:
          - vault_database_password | default('') | length >= 12
          - vault_redmine_secret_key_base | default('') | length >= 64
        fail_msg: >-
          Add the PostgreSQL password and the shared Redmine secret to the
          encrypted ansible/group_vars/all/vault.yml file.
      no_log: true

    - name: Validate Datadog secrets
      ansible.builtin.assert:
        that:
          - vault_datadog_api_key | default('') | trim | length > 0
          - vault_datadog_app_key | default('') | trim | length > 0
        fail_msg: >-
          Add the Datadog API key and Application key to the encrypted
          ansible/group_vars/all/vault.yml file.
      no_log: true

    - name: Render Yandex Cloud service account key
      ansible.builtin.template:
        src: templates/authorized_key.json.j2
        dest: "{{ terraform_directory }}/authorized_key.json"
        mode: "0600"
      no_log: true
      diff: false

    - name: Render Terraform provider variables
      ansible.builtin.template:
        src: templates/secrets.auto.tfvars.j2
        dest: "{{ terraform_directory }}/secrets.auto.tfvars"
        mode: "0600"
      no_log: true
      diff: false

    - name: Render Terraform backend configuration
      ansible.builtin.template:
        src: templates/backend.hcl.j2
        dest: "{{ terraform_directory }}/backend.hcl"
        mode: "0600"
      no_log: true
      diff: false

- name: Prepare web servers and deploy Redmine
  hosts: webservers
  become: true
  gather_facts: false
  serial: 1

  pre_tasks:
    - name: Gather facts for server preparation and deployment
      ansible.builtin.setup:
      tags:
        - prepare
        - deploy

  roles:
    - role: geerlingguy.docker
      tags:
        - prepare

  tasks:
    - name: Reload systemd after Docker package changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      tags:
        - prepare

    - name: Reset Docker systemd failure counters
      ansible.builtin.command:
        cmd: systemctl reset-failed docker.service docker.socket
      changed_when: false
      tags:
        - prepare

    - name: Start and enable Docker socket
      ansible.builtin.systemd_service:
        name: docker.socket
        state: started
        enabled: true
      tags:
        - prepare

    - name: Start and enable Docker service
      ansible.builtin.systemd_service:
        name: docker.service
        state: started
        enabled: true
      tags:
        - prepare

    - name: Install HTTP client for application checks
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags:
        - prepare

    - name: Validate deployment variables
      ansible.builtin.assert:
        that:
          - redmine_database_host | default('') | trim | length > 0
          - vault_database_password | default('') | length >= 12
          - vault_redmine_secret_key_base | default('') | length >= 64
        fail_msg: >-
          Generate the inventory from Terraform outputs and configure the
          application secrets in the encrypted vault.yml file.
      no_log: true
      tags:
        - deploy

    - name: Create Redmine directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ redmine_directory }}"
        - "{{ redmine_data_directory }}"
      tags:
        - deploy

    - name: Render Redmine environment file
      ansible.builtin.template:
        src: templates/redmine.env.j2
        dest: "{{ redmine_env_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false
      tags:
        - deploy

    - name: Run Redmine container
      community.docker.docker_container:
        name: "{{ redmine_container_name }}"
        image: "{{ redmine_image }}"
        state: started
        pull: missing
        restart_policy: unless-stopped
        env_file: "{{ redmine_env_file }}"
        published_ports:
          - "{{ redmine_port }}:3000"
        volumes:
          - "{{ redmine_data_directory }}:/usr/src/redmine/files"
      no_log: true
      tags:
        - deploy

    - name: Wait for Redmine to become ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ redmine_port }}/login"
        status_code: 200
        return_content: false
      register: redmine_health
      retries: 30
      delay: 10
      until: redmine_health.status == 200
      tags:
        - deploy

- name: Install and configure Datadog Agent
  hosts: webservers
  become: true
  gather_facts: true
  serial: 1
  tags:
    - monitoring

  pre_tasks:
    - name: Validate Datadog Agent secret
      ansible.builtin.assert:
        that:
          - vault_datadog_api_key | default('') | trim | length > 0
        fail_msg: >-
          Add vault_datadog_api_key to the encrypted
          ansible/group_vars/all/vault.yml file.
      no_log: true

  roles:
    - role: datadog.dd.agent

