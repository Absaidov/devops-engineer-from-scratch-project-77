---
yc_cloud_id: "b1g00n7k23iba151u06k"
yc_folder_id: "b1gpj5odp0m76jce43ci"
yc_zone: "ru-central1-d"
tf_state_bucket: "project-77-terraform-state-b1gpj5odp0m76jce43ci"

ssh_public_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_ed25519.pub"
ssh_allowed_cidrs:
  - "157.228.66.209/32"
  - "185.216.63.119/32"

deployment_ssh_user: ubuntu
docker_users:
  - "{{ deployment_ssh_user }}"
docker_install_compose: false
docker_service_manage: false

redmine_image: "redmine:6.1.5"
redmine_container_name: redmine
redmine_port: 3000
redmine_directory: /opt/redmine
redmine_data_directory: "{{ redmine_directory }}/files"
redmine_env_file: "{{ redmine_directory }}/.env"
redmine_database_port: 6432
redmine_database_name: redmine
redmine_database_username: redmine
redmine_database_password: "{{ vault_database_password }}"
redmine_secret_key_base: "{{ vault_redmine_secret_key_base }}"

datadog_api_key: "{{ vault_datadog_api_key }}"
datadog_app_key: "{{ vault_datadog_app_key }}"
datadog_site: datadoghq.com
datadog_api_url: "https://api.datadoghq.com/"
datadog_config:
  tags:
    - "env:production"
    - "service:redmine"
    - "project:project-77"
datadog_checks:
  http_check:
    init_config:
    instances:
      - name: redmine-local
        url: "http://127.0.0.1:{{ redmine_port }}/login"
        method: GET
        timeout: 5
        http_response_status_code: "200"
        tags:
          - "env:production"
          - "service:redmine"
          - "project:project-77"
